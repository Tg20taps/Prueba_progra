# =============================================================================
# DATA CATALOG — Pipeline Logística de Transportes (SCY1101)
# =============================================================================
# Organizado según las capas de datos de Kedro:
#   01_raw         → datos originales sin modificar
#   02_intermediate → datasets limpios (post data_cleaning)
#   03_primary      → dataset maestro consolidado (post data_transformation)
#   08_reporting    → reportes de calidad e ingesta
# =============================================================================

# ---------------------------------------------------------------------------
# CAPA 01_RAW — Datos originales (solo lectura)
# ---------------------------------------------------------------------------
envios_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/envios.csv
  load_args:
    encoding: utf-8
    sep: ","

rutas_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/rutas.csv
  load_args:
    encoding: utf-8
    sep: ","

vehiculos_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/vehiculos.csv
  load_args:
    encoding: utf-8
    sep: ","

incidencias_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/incidencias.csv
  load_args:
    encoding: utf-8
    sep: ","

# ---------------------------------------------------------------------------
# CAPA 02_INTERMEDIATE — Datos limpios (salida de data_cleaning)
# ---------------------------------------------------------------------------
envios_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/envios_clean.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: utf-8

rutas_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/rutas_clean.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: utf-8

vehiculos_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/vehiculos_clean.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: utf-8

incidencias_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/incidencias_clean.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: utf-8

# ---------------------------------------------------------------------------
# CAPA 03_PRIMARY — Datasets de transformación y dataset maestro
# ---------------------------------------------------------------------------
dataset_unificado:
