# ---------------------------------------------------------------------------
# CAPA 05_MODEL_INPUT — Datasets listos para entrenar modelos
# NOTA: features_ml_base es MemoryDataset (no persiste en disco;
#       vive solo durante la ejecución del pipeline model_input).
# ---------------------------------------------------------------------------
model_input_clasificacion:
